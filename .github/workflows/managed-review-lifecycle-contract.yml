name: Managed review lifecycle contract

on:
  pull_request:
    paths:
      - 'experiments/managed-review-lifecycle-ci/**'
      - '.github/workflows/managed-review-lifecycle-contract.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/managed-review-lifecycle-ci/**'
      - '.github/workflows/managed-review-lifecycle-contract.yml'

permissions:
  contents: read

jobs:
  lifecycle-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: experiments/managed-review-lifecycle-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/managed-review-lifecycle-ci/requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -q
